<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4SKY · Leads Hub</title>
  <style>
    :root { --bg:#0b1220; --card:#131c2e; --accent:#3aa0ff; --ok:#2ecc71; --txt:#e6edf6; --muted:#8aa0bd; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(160deg,#0b1220,#0f1830); color:var(--txt); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:var(--card); border:1px solid #22314c; border-radius:16px; padding:36px; max-width:520px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .badge { display:inline-block; background:rgba(58,160,255,.15); color:var(--accent); font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:.5px; }
    h1 { margin:14px 0 6px; font-size:26px; }
    p.sub { color:var(--muted); margin:0 0 22px; }
    label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
    input { width:100%; padding:11px 13px; border-radius:9px; border:1px solid #2a3b5c; background:#0d1526; color:var(--txt); font-size:14px; }
    button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:9px; background:var(--accent); color:#04101f; font-weight:700; font-size:15px; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    .host { margin-top:22px; font-size:12px; color:var(--muted); border-top:1px solid #22314c; padding-top:14px; }
    .host b { color:var(--ok); }
    #msg { margin-top:14px; font-size:14px; min-height:20px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">4SKY GROUP · CONTENEUR</span>
    <h1>Leads Hub</h1>
    <p class="sub">Micro-service conteneurisé — démonstration <b>ACR → ACI → ACA</b> sur Azure.</p>

    <label for="name">Nom</label>
    <input id="name" placeholder="Jean Dupont">
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="jean@exemple.com">
    <button onclick="send()">Enregistrer le lead</button>
    <div id="msg"></div>

    <div class="host">Servi par : <b id="host">…</b> · leads enregistrés : <b id="count">0</b></div>
  </div>

  <script>
    async function refresh() {
      try {
        const h = await (await fetch('/api/health')).json();
        document.getElementById('host').textContent = h.host;
        const l = await (await fetch('/api/leads')).json();
        document.getElementById('count').textContent = l.length;
      } catch (e) {}
    }
    async function send() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg');
      const r = await fetch('/api/leads', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name,email}) });
      const data = await r.json();
      if (r.ok) { msg.style.color = '#2ecc71'; msg.textContent = '✅ Lead #' + data.id + ' enregistré !'; document.getElementById('name').value=''; document.getElementById('email').value=''; }
      else { msg.style.color = '#e74c3c'; msg.textContent = '❌ ' + data.error; }
      refresh();
    }
    refresh();
  </script>
</body>
</html>
