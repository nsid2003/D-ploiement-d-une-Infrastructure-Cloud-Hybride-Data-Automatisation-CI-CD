name: CI/CD leads-hub (DevSecOps)

# Déclencheurs : à chaque push sur main touchant l'app, ou manuellement
on:
  push:
    branches: [ main ]
    paths:
      - 'leads-hub/**'
      - '.github/workflows/deploy-leads-hub.yml'
  workflow_dispatch:

# Permissions requises pour l'authentification OIDC (sans secret)
permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acr4skydaryl
  IMAGE: leads-hub
  RG: rg-4sky-compute
  ACA_APP: aca-leads-hub

jobs:
  build-scan-deploy:
    name: Build, scan de sécurité et déploiement
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Connexion à Azure via OIDC (aucun mot de passe stocké)
      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Connexion au registre ACR
      - name: Connexion à l'ACR
        run: az acr login --name "$ACR_NAME"

      # 4. Construire l'image (taguée avec le SHA du commit + latest)
      - name: Build de l'image
        run: |
          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}" \
            -t "$ACR_NAME.azurecr.io/$IMAGE:latest" \
            ./leads-hub

      # 5. GATE SÉCURITÉ — scan de vulnérabilités de l'image (Trivy)
      - name: Scan de sécurité (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}'
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # mettre '1' pour BLOQUER le déploiement si vulnérabilité critique

      # 6. Pousser l'image vers l'ACR
      - name: Push de l'image
        run: docker push --all-tags "$ACR_NAME.azurecr.io/$IMAGE"

      # 7. Déployer la nouvelle image sur Azure Container Apps
      - name: Déploiement sur ACA
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$RG" \
            --image "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}"
