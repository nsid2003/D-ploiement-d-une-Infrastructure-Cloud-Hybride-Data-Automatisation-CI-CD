name: CI/CD leads-hub (DevSecOps)

# Déclencheurs : à chaque push sur main touchant l'app, ou manuellement
on:
  push:
    branches: [ main ]
    paths:
      - 'leads-hub/**'
      - '.github/workflows/deploy-leads-hub.yml'
  workflow_dispatch:

# Permissions requises pour l'authentification OIDC (sans secret)
permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acr4skydaryl
  IMAGE: leads-hub
  RG: rg-4sky-compute
  ACA_APP: aca-leads-hub

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Construire l'image et la pousser dans l'ACR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # ÉTAPE DE DEBUG TEMPORAIRE — affiche le subject réel du token OIDC
      - name: Debug - subject OIDC réel
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          python3 -c "import sys,base64,json; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); s=c['sub']; e='repo:nsid2003/D-ploiement-d-une-Infrastructure-Cloud-Hybride-Data-Automatisation-CI-CD:ref:refs/heads/main'; print('MATCH_STANDARD =', s==e); print('SUB_LEN =', len(s)); print('SUB_B64 =', base64.b64encode(s.encode()).decode())" "$IDTOKEN"

      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion à l'ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build & push de l'image
        run: |
          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}" \
            -t "$ACR_NAME.azurecr.io/$IMAGE:latest" \
            ./leads-hub
          docker push --all-tags "$ACR_NAME.azurecr.io/$IMAGE"

  # ─────────────────────────────────────────────
  # JOB 2 — Gate sécurité : scan de vulnérabilités (dépend de build)
  # ─────────────────────────────────────────────
  security-scan:
    name: Scan sécurité (Trivy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion à l'ACR
        run: az acr login --name "$ACR_NAME"

      - name: Scan de l'image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}'
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # mettre '1' pour BLOQUER le déploiement si vulnérabilité critique

  # ─────────────────────────────────────────────
  # JOB 3 — Déploiement sur Azure Container Apps (dépend du scan)
  # ─────────────────────────────────────────────
  deploy:
    name: Déploiement ACA
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Déploiement de la nouvelle image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$RG" \
            --image "$ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}"
